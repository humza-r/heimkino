<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heimkino</title>
<meta name="description" content="beta version">
<meta name="theme-color" content="#fbfbf9">
<meta property="og:site_name" content="Heimkino">
<meta property="og:title" content="Heimkino">
<meta property="og:description" content="beta version">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Heimkino">
<meta name="twitter:description" content="An invitation-only screening programme in Berlin.">

<script src="config.js"></script>

<style>
  :root{
    --paper:#fbfbf9; --ink:#1b1a17; --soft:#6b6862; --faint:#a7a29a; --rule:#c9c3b6;
    --u:8px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ background:var(--paper); color:var(--ink); font-family:var(--mono);
    font-size:13px; line-height:1.55; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  .wrap{ width:min(560px, calc(100vw - 48px)); margin:40px auto; }
  @media (max-width:560px){ .wrap{ width:auto; margin:18px; } }

  /* sections */
  section{ margin-top:calc(var(--u)*4.5); }
  #current{ margin-top:0; }
  .sec-h{ font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink); }
  .sec-date{ float:right; color:var(--soft); letter-spacing:0.1em; }
  hr.rule{ border:0; border-top:1px dashed var(--rule); margin:7px 0 calc(var(--u)*2); }

  /* three type levels */
  .title{ font-size:16px; font-weight:700; text-transform:uppercase; letter-spacing:0.01em; margin-top:2px; line-height:1.3; }
  .meta{ font-size:12px; color:var(--soft); }
  .small{ font-size:11px; color:var(--faint); }
  p.syn{ font-size:13px; margin:calc(var(--u)*1.5) 0 0; max-width:54ch; }

  /* schedule + capacity */
  .sched{ margin-top:calc(var(--u)*2); font-size:12px; color:var(--soft); line-height:1.85; }
  .sched b{ color:var(--ink); font-weight:400; }
  .roster{ margin-top:10px; font-size:12px; color:var(--soft); }
  /* RSVP access state as a quiet receipt seam (no counts, no meters, no alarm) */
  .rsvp{ margin-top:calc(var(--u)*2.75); display:flex; align-items:center; gap:12px; }
  .rsvp .edge{ flex:1; height:0; border-top:1px dashed var(--rule); }
  .rsvp .lbl{ font-size:11px; letter-spacing:0.16em; white-space:nowrap; color:var(--soft); }
  .rsvp.closed .edge{ border-top-style:solid; }
  /* seat plan (kept in the receipt aesthetic; outlined furniture, fixed orientation) */
  .present-toggle{ display:block; margin-top:calc(var(--u)*1.5); font-size:13px; text-align:left; color:var(--soft); }
  .present-toggle[aria-pressed="true"]{ color:var(--ink); }
  .loc-copy{ background:none; border:0; padding:0; margin:0; font:inherit; color:inherit; text-align:left; cursor:pointer; }
  .seat-who{ margin-top:calc(var(--u)*1.5); font-size:13px; }
  .seat-hint{ margin-top:calc(var(--u)*1.25); font-size:12px; color:var(--soft); }
  .plan{ margin-top:calc(var(--u)*2); overflow-x:auto; }
  .banner{ text-align:center; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--soft); padding-bottom:calc(var(--u)*2); margin-bottom:calc(var(--u)*2.5); border-bottom:1px dashed var(--rule); }
  .banner[hidden]{ display:none; }
  .banner b{ color:var(--ink); font-weight:normal; }
  .plan-row{ display:flex; gap:12px; align-items:flex-start; justify-content:space-between; min-width:260px; }
  .furn{ text-align:center; }
  .furn-l{ font-size:9px; letter-spacing:0.06em; text-transform:uppercase; color:var(--soft); margin-bottom:5px; white-space:nowrap; }
  .furn-b{ display:flex; flex-direction:column; gap:5px; align-items:center; }
  .seat{ width:36px; height:28px; border:1px solid var(--ink); background:transparent; border-radius:0; cursor:pointer; padding:0; }
  .seat.taken{ border-color:var(--faint); opacity:.4; cursor:default; }
  .seat.sel{ border-width:2px; background:var(--ink); }
  .seat.mine{ outline:1px solid var(--ink); outline-offset:2px; }
  .plan-view .seat{ cursor:default; }
  .plan-view .seat.taken{ background:var(--ink); border-color:var(--ink); opacity:1; }
  .plan-legend{ display:flex; gap:14px; align-items:center; margin-top:12px; font-size:10px; color:var(--soft); flex-wrap:wrap; }
  .plan-legend .lg{ display:inline-flex; align-items:center; gap:5px; }
  .lg-box{ width:12px; height:10px; border:1px solid var(--ink); display:inline-block; }
  .lg-box.taken{ background:var(--ink); }
  .lg-box.mine{ outline:1px solid var(--ink); outline-offset:1px; }
  .lg-open{ margin-left:auto; letter-spacing:0.06em; }
  .plan-wrap{ margin-top:calc(var(--u)*2.5); }
  .roster.seated{ margin-top:calc(var(--u)*2.5); }
  .roster.seated .cm{ display:flex; align-items:baseline; gap:10px; margin-top:9px; }
  .roster.seated .cm:first-child{ margin-top:0; }
  .roster.seated .cm-n{ color:var(--ink); white-space:nowrap; }
  .roster.seated .cm-lead{ flex:1; align-self:center; height:0; border-bottom:1px dotted var(--rule); }
  .roster.seated .cm-s{ font-size:11px; color:var(--soft); white-space:nowrap; letter-spacing:0.06em; }
  .plan-floor{ margin-top:16px; text-align:center; }
  .plan-floor .furn-b{ flex-direction:row; justify-content:center; }
  .plan-floor .seat{ width:120px; }
  .plan-screen{ margin-top:16px; border-top:1px dashed var(--rule); text-align:center; font-size:10px; letter-spacing:0.32em; color:var(--soft); padding-top:6px; }
  .review{ list-style:none; margin:calc(var(--u)*1.5) 0 0; padding:0; font-size:13px; }
  .review li{ padding:2px 0; }
  .roster span{ color:var(--ink); }

  /* protected info */
  .proto{ margin-top:calc(var(--u)*2.75); }
  .proto .k{ font-size:11px; color:var(--soft); }
  .proto .note{ margin-top:5px; white-space:pre-line; color:var(--ink); }
  .proto .note + .k{ margin-top:calc(var(--u)*2.75); }
  .proto .v{ margin-top:5px; white-space:pre-line; color:var(--ink); }

  /* typed-line inputs */
  .line{ display:flex; align-items:baseline; gap:8px; margin-top:calc(var(--u)*1.5); }
  .inl{ color:var(--soft); }
  .gt{ color:var(--faint); }
  input[type=text]{ border:0; border-bottom:1px solid currentColor; background:transparent; border-radius:0;
    font-family:inherit; font-size:16px; color:inherit; padding:4px 0; min-width:0; }
  input[type=text]::placeholder{ color:var(--faint); }
  input[type=text]:focus{ outline:none; border-bottom-color:var(--ink); }
  .grow{ flex:1; }

  /* text-link controls */
  .lnk{ background:none; border:0; padding:0; color:var(--ink); cursor:pointer; font:inherit; }
  .lnk:hover, .lnk:focus-visible{ text-decoration:underline; outline:none; }
  .lnk[disabled]{ color:var(--faint); cursor:default; text-decoration:none; }
  /* generous tap targets for the inline submit + action controls on touch */
  .int-go, #add-go, .acts .lnk, #confirm-go, #unlock-go, #wish-go, #cal-go{ padding:8px 6px; margin:-8px -6px; font-size:15px; }
  .acts{ margin-top:calc(var(--u)*2); display:flex; gap:20px; }

  /* RSVP name rows */
  .rows{ margin-top:calc(var(--u)*1); }
  .row{ display:flex; align-items:baseline; gap:8px; margin-top:9px; }
  .row .grow{ flex:1; }
  .rm{ background:none; border:0; padding:0 2px; cursor:pointer; color:var(--faint); font-size:14px; line-height:1; }
  .rm:hover, .rm:focus-visible{ color:#9a3b3b; outline:none; }
  .addmore{ margin-top:11px; }

  /* confirmed reservation */
  .slip ul{ list-style:none; margin:calc(var(--u)*1) 0 0; padding:0; }
  .slip li{ display:flex; justify-content:space-between; align-items:baseline; padding:2px 0; }
  .slip .rm{ display:none; }
  .slip.editing .rm{ display:inline; }
  .slip-foot{ margin-top:calc(var(--u)*2); font-size:12px; color:var(--soft); display:flex; gap:20px; }
  .cal{ margin-top:calc(var(--u)*1.5); }

  /* upcoming */
  .up{ margin-top:calc(var(--u)*1); }
  .up-film{ margin-top:calc(var(--u)*3.25); }
  .up-film:first-child{ margin-top:calc(var(--u)*2); }
  .up-date{ font-size:11px; color:var(--soft); letter-spacing:0.06em; margin-bottom:4px; }
  .int{ margin-top:calc(var(--u)*1.5); }
  .int-btn{ display:flex; width:100%; align-items:center; gap:12px; background:none; border:0; padding:0; cursor:pointer;
    color:var(--soft); font:inherit; text-align:left; }
  .int-btn[hidden]{ display:none; }
  .int-btn:not(:disabled):hover .int-label{ text-decoration:underline; }
  .int-btn:disabled{ cursor:default; color:var(--soft); }
  .int-label{ white-space:nowrap; }
  .int-rule{ flex:1; border-bottom:1px dotted var(--rule); height:0; }
  .int-n{ color:var(--ink); white-space:nowrap; }
  .int-form{ display:flex; width:100%; align-items:baseline; gap:12px; }
  .int-form[hidden]{ display:none; }
  .int-form .grow{ flex:1; }

  /* past */
  .pastlist{ margin-top:calc(var(--u)*1); }
  .entry{ margin-top:calc(var(--u)*3.25); }
  .entry:first-child{ margin-top:calc(var(--u)*2); }
  .entry .dt{ font-size:11px; color:var(--soft); letter-spacing:0.06em; }
  .entry.priv{ opacity:0.5; }
  .tags{ margin-top:9px; }
  .tag{ display:inline-block; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--soft); margin-right:16px; }
  .rec{ margin-top:6px; font-size:12px; color:var(--soft); }
  .rec span{ color:var(--ink); }
  .att{ margin-top:9px; font-size:12px; color:var(--soft); }
  .peek{ background:none; border:0; padding:0 0 1px; cursor:pointer; color:var(--soft);
    border-bottom:1px dotted var(--rule); font:inherit; -webkit-user-select:none; user-select:none; }
  .peek:hover, .peek:focus-visible{ color:var(--ink); outline:none; }
  .att-names{ display:none; color:var(--ink); }
  .att.revealed .att-names{ display:inline; }

  /* suggest */
  .sug-form{ margin-top:calc(var(--u)*1.5); }
  .sug-form[hidden]{ display:none; }

  /* messages */
  .msg, .nmsg{ margin-top:calc(var(--u)*1.5); font-size:11px; color:var(--soft); min-height:14px; }
  .msg.err, .nmsg.err{ color:#9a3b3b; }
  .msg.ok, .nmsg.ok{ color:var(--ink); }

  /* footer */
  .foot{ margin-top:calc(var(--u)*5.5); padding-top:calc(var(--u)*2); border-top:1px dashed var(--rule);
    font-size:11px; color:var(--faint); letter-spacing:0.04em; }

  /* honeypots */
  .hp{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  .nhp{ display:none !important; }

  /* motion */
  @media (prefers-reduced-motion: no-preference){ .int-label, .lnk{ transition:opacity .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="banner" class="banner" hidden aria-live="polite"></div>
  <section id="current"></section>
  <section id="admission"><div id="admit-body"></div></section>
  <section id="upcoming"></section>
  <section id="suggest"></section>
  <section id="past"></section>
  <div class="foot" id="foot"></div>
</div>

<script>
(function(){
  const C = window.CONFIG;
  const EP = (C.endpoint || '').trim();
  const startedAt = Date.now();
  const $ = (s, r=document) => r.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pad = n => String(n).padStart(2,'0');
  const fmt = (iso, opts) => { const d = new Date(iso + 'T00:00:00'); return isNaN(d) ? iso : d.toLocaleDateString('en-GB', opts); };
  const rt = (v, unit) => { const m = String(v==null?'':v).match(/\d+/); return m ? (unit==='min' ? m[0]+' min' : m[0]+'\u2032') : esc(v||''); };
  function icsHref(){
    const n = CUR, sch = C.schedule || {}; if (!n || !n.date || !EP) return '#';
    const t = n.time || sch.film || sch.doors || '20:00';
    const rtm = n.runtime ? (String(n.runtime).match(/\d+/)||['120'])[0] : '120';
    return EP + '?ics=1&date=' + encodeURIComponent(n.date) + '&title=' + encodeURIComponent(n.title)
      + '&time=' + encodeURIComponent(t) + '&runtime=' + encodeURIComponent(rtm)
      + (sessionCode ? '&code=' + encodeURIComponent(sessionCode) : '');
  }
  function gcalUrl(){
    const n = CUR, sch = C.schedule || {}; if (!n || !n.date) return '';
    const place = (gated && gated.venue) ? gated.venue : '';
    const filmT = (n.time || sch.film || sch.doors || '20:00');
    const fh = parseInt(filmT.split(':')[0],10)||20, fm = parseInt(filmT.split(':')[1],10)||0;
    const dur = n.runtime ? parseInt((String(n.runtime).match(/\d+/)||['120'])[0],10) : 120;
    const s = new Date(n.date + 'T' + pad(fh) + ':' + pad(fm) + ':00');
    const e = new Date(s.getTime() + dur*60000);
    const L = d => d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
      + '&text=' + encodeURIComponent('Heimkino: ' + n.title)
      + '&dates=' + L(s) + '/' + L(e) + '&ctz=Europe/Berlin'
      + (place ? '&location=' + encodeURIComponent(place) : '');
  }
  function openGcal(){ const u = gcalUrl(); if (!u) return; track('calendar'); window.open(u, '_blank', 'noopener'); }

  const KEY = 'heimkino:res';
  const store = {
    get(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(_){ return null; } },
    set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(_){ } },
    clear(){ try{ localStorage.removeItem(KEY); }catch(_){ } }
  };

  let mine  = store.get();
  let slip  = null;
  let gated = null;
  let agg   = null;
  let sessionCode = null;
  let roster = null;
  let admInited = false;
  let flashed = false;
  let interestCounts = {};
  let seatMap = {};                 // seatId -> occupant name (names only after unlock)
  let takenIds = [];                // seat ids taken (public, pre-unlock)
  let rsvpStage = 'names';          // names | seats | review
  let pendNames = [], pendSeats = [], pendIdx = 0;

  const DEF_ROOM = [ {key:'churchBench',label:'church bench',count:2},{key:'fold',label:'folding',count:1},{key:'chaise',label:'chaise',count:1},{key:'black',label:'black chair',count:1},{key:'sofa',label:'sofa',count:2},{key:'floor',label:'floor',count:1} ];
  const ROOM = (C.roomPlan && C.roomPlan.length) ? C.roomPlan : DEF_ROOM;
  const SEAT_LABEL = {}; ROOM.forEach(o => { SEAT_LABEL[o.key] = o.label; });
  // back-row order (everything except the floor, which renders below), left -> right as listed in house
  const ROOM_ORDER = ROOM.filter(o => o.key !== 'floor').map(o => o.key);
  function seatLabel(id){ return SEAT_LABEL[String(id).split('-')[0]] || id; }
  function firstName(n){ return String(n||'').trim().split(/\s+/)[0]; }
  function initials(n){ const p=String(n||'').trim().split(/\s+/); return ((p[0]?p[0][0]:'')+(p[1]?p[1][0]:'')).toUpperCase(); }
  function seatMode(){
    if (CUR && CUR.seatSelectionEnabled != null) return !!CUR.seatSelectionEnabled;   // per-screening wins
    return !!C.seatSelection;                                                          // else house default
  }
  function seatTaken(id){ return takenIds.indexOf(id) >= 0 || seatMap.hasOwnProperty(id); }
  function rsvpState(){
    const ov = (CUR && CUR.rsvp) || C.rsvp || 'auto';
    if (ov === 'closed') return 'closed';
    if (ov === 'open') return 'open';
    if (seatMode()) return openSeats().filter(id => !seatTaken(id)).length > 0 ? 'open' : 'closed';
    if (agg && agg.capacity != null) return agg.confirmed >= agg.capacity ? 'closed' : (agg.capacity - agg.confirmed <= 2 ? 'closing' : 'open');
    return 'open';
  }
  function allSeats(){ const ids=[]; ROOM.forEach(o=>{ const c=Math.max(1, o.count||1); for(let i=1;i<=c;i++) ids.push(o.key+'-'+i); }); return ids; }
  function expandOpen(list){
    const out=[];
    (list||[]).forEach(raw => {
      const tok = String(raw).trim(); if(!tok) return;
      if (tok.indexOf('-') >= 0){                                   // explicit id like sofa-1
        if (ROOM.some(o => o.key === tok.split('-')[0])) out.push(tok);
        return;
      }
      const o = ROOM.filter(x => String(x.key).toLowerCase() === tok.toLowerCase())[0];   // match the seats key
      if (o){ const c=Math.max(1,o.count||1); for(let i=1;i<=c;i++) out.push(o.key+'-'+i); }
      // unknown key: ignored (so a typo can't spawn a stray box or break order)
    });
    return out;
  }
  function openSeats(){
    const raw = (CUR && CUR.openSeats && CUR.openSeats.length) ? CUR.openSeats
              : (C.openSeats && C.openSeats.length) ? C.openSeats : null;
    let list = raw ? expandOpen(raw) : allSeats();
    if (seatMode() && list.indexOf('floor-1') < 0 && ROOM.some(o=>o.key==='floor')) list.push('floor-1');
    return list;
  }

  function todayISO(){ const d=new Date(), p=x=>String(x).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
  function pickCurrent(){
    const today = todayISO(), n = C.next;
    if (n && n.title && (!n.date || n.date >= today)) return { cur:n, promoted:null, retired:null };
    const retired = (n && n.title && n.date && n.date < today) ? n : null;
    const dated = (C.upcoming||[]).filter(u=>u && u.title && u.date && u.date >= today).sort((a,b)=> a.date < b.date ? -1 : 1);
    if (dated.length) return { cur:dated[0], promoted:dated[0], retired:retired };
    return { cur:null, promoted:null, retired:retired };
  }
  const PICK = pickCurrent();
  const CUR = PICK.cur;

  async function post(action, payload){
    if (!EP) throw new Error('Reservations are not connected yet.');
    const r = await fetch(EP, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({ action }, payload)) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Something went wrong.');
    return d;
  }
  function track(ev){
    if (!EP) return;
    try{ fetch(EP, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'event', event:ev, film:(CUR && CUR.title) || '' }) }); }catch(_){}
  }

  // ---------- page chrome ----------
  function renderChrome(){
    document.title = (CUR ? CUR.title : (C.wordmark || 'Programme'));
    const d = new Date(), p = x => String(x).padStart(2,'0');
    const foot = $('#foot'); if (foot) foot.textContent = 'updated ' + p(d.getDate()) + '.' + p(d.getMonth()+1) + '.' + String(d.getFullYear()).slice(2);
    renderCountdown();
  }
  function parseHM_(t){
    t = String(t||'').trim();
    if (t.indexOf(':') >= 0){ const a=t.split(':'); return [parseInt(a[0],10)||0, parseInt(a[1],10)||0]; }
    const d = t.replace(/\D/g,'');
    if (d.length >= 3) return [parseInt(d.slice(0, d.length-2),10)||0, parseInt(d.slice(-2),10)||0];
    return [parseInt(d,10)||20, 0];
  }
  function schedTime_(which){
    const n = CUR, sch = C.schedule || {}; if (!n || !n.date) return null;
    const t = which === 'doors' ? (sch.doors || sch.film || n.time || '20:00') : (n.time || sch.film || sch.doors || '20:00');
    const hm = parseHM_(t), dp = String(n.date).split('-').map(Number);
    return new Date(dp[0] || 1970, (dp[1] || 1) - 1, dp[2] || 1, hm[0], hm[1], 0);
  }
  function renderCountdown(){
    const b = $('#banner'); if (!b) return;
    const doors = schedTime_('doors');
    if (!doors){ b.hidden = true; return; }
    const film = schedTime_('film');
    const now = Date.now(), doorsMs = doors.getTime();
    const rt = CUR.runtime ? parseInt((String(CUR.runtime).match(/\d+/)||['120'])[0], 10) : 120;
    const end = (film ? film.getTime() : doorsMs) + rt*60000;
    let txt;
    if (now >= doorsMs && now <= end) txt = 'on now';
    else if (now > end){ b.hidden = true; return; }
    else {
      let mins = Math.round((doorsMs - now) / 60000);
      const d = Math.floor(mins/1440); mins -= d*1440;
      const h = Math.floor(mins/60), m = mins % 60;
      const parts = [];
      if (d) parts.push(d + 'd');
      if (h) parts.push(h + 'h');
      if (m) parts.push(m + 'm');
      txt = 'doors in ' + (parts.length ? parts.join(' ') : '1m');
    }
    b.hidden = false;
    b.innerHTML = (CUR.title ? esc(CUR.title) + ' &nbsp;·&nbsp; ' : '') + '<b>' + esc(txt) + '</b>';
  }

  function renderVenue(){}

  // ---------- current screening ----------

  const VKEY = 'heimkino:interested';
  function votedSet(){ try{ return JSON.parse(localStorage.getItem(VKEY)) || {}; }catch(_){ return {}; } }
  function hasVoted(film){ return !!votedSet()[film]; }
  function markVoted(film){ const s=votedSet(); s[film]=1; try{ localStorage.setItem(VKEY, JSON.stringify(s)); }catch(_){ } }
  function renderCurrent(){
    const n = CUR, sch = C.schedule || {};
    const curSec = document.getElementById('current'), admSec = document.getElementById('admission');
    if (!n){
      if (curSec){ curSec.innerHTML = ''; curSec.style.display = 'none'; }
      if (admSec){ admSec.style.display = 'none'; }
      return;
    }
    if (curSec) curSec.style.display = '';
    if (admSec) admSec.style.display = '';
    const meta = [n.director, n.year, n.edition].filter(Boolean).join(' / ');
    const filmStart = n.time || sch.film || '';
    const dateLine = esc(fmt(n.date, {weekday:'short', day:'numeric', month:'short', year:'numeric'})).toUpperCase();
    let cap = '';
    if (agg && typeof agg.confirmed === 'number'){
      const rs = rsvpState();
      const st = rs, lb = rs === 'closed' ? 'rsvp closed' : (rs === 'closing' ? 'nearly full' : 'rsvp open');
      cap = `<div class="rsvp ${st}" role="status"><span class="edge"></span><span class="lbl">${lb}</span><span class="edge"></span></div>`;
      if (gated && seatMode()){
        const seated = Object.keys(seatMap).map(id => `<div class="cm"><span class="cm-n">${esc(seatMap[id])}</span><span class="cm-lead"></span><span class="cm-s">${esc(seatLabel(id))}</span></div>`);
        const seatedNames = Object.keys(seatMap).map(id => seatMap[id]);
        const plain = (roster||[]).filter(n => seatedNames.indexOf(n) < 0).map(n => `<div class="cm"><span class="cm-n">${esc(n)}</span></div>`);
        const list = seated.concat(plain);
        if (list.length) cap += `<div class="roster seated">${list.join('')}</div>`;
      } else if (gated && roster && roster.length){
        cap += `<div class="roster"><span>${roster.map(esc).join('</span> \u00b7 <span>')}</span></div>`;
      }
    }
    $('#current').innerHTML = `
      <div class="sec-h">Next screening<span class="sec-date">${dateLine}</span></div><hr class="rule">
      <div class="title">${esc(n.title)}</div>
      <div class="meta">${esc(meta)}</div>
      ${n.runtime ? `<div class="meta">${rt(n.runtime,'min')}</div>` : ''}
      ${(n.lang || C.language) ? `<div class="meta">${esc(n.lang || C.language)}</div>` : ''}
      ${n.rec ? `<div class="rec">rec: <span>${esc(n.rec)}</span></div>` : ''}
      ${n.away ? `<div class="tags"><span class="tag">away screening</span></div>` : ''}
      ${n.synopsis ? `<p class="syn">${esc(n.synopsis)}</p>` : ''}
      <div class="sched">${sch.doors ? `doors <b>${esc(sch.doors)}</b><br>` : ''}${filmStart ? `film&nbsp; <b>${esc(filmStart)}</b>` : ''}</div>
      ${cap}`;
  }

  // ---------- admission ----------
  function admitMsg(t, cls){ const m = $('#admit-msg'); if(m){ m.textContent = t; m.className = 'msg ' + (cls||''); } }

  function renderAdmission(){
    const body = $('#admit-body'); if(!body) return;
    if (!CUR){ return; }
    if (!EP){ body.innerHTML = `<div class="small">reservations offline</div>`; return; }

    const sm = seatMode();
    const noteBlk = (gated && gated.houseNote) ? `<div class="proto"><div class="k">house note</div><div class="note">${esc(gated.houseNote)}</div></div>` : '';
    const locBlk  = (gated && gated.venue) ? `<div class="proto proto-loc"><div class="k">location</div><button type="button" class="v loc-copy" id="loc-copy" title="tap to copy">${esc(gated.venue)}</button></div>` : '';
    const planBlk = m => sm ? `<div class="plan-wrap">${roomPlanHtml(m)}</div>` : '';
    const msg = `<div class="msg" id="admit-msg" role="status" aria-live="polite"></div>`;
    let html = '';

    if (slip){
      html += `<div class="sec-h">Coming</div><hr class="rule">`
        + noteBlk + planBlk('view')
        + `<div class="slip" id="slip">`
        + `<ul id="slip-names">${slip.names.map((nm,i)=>`<li><span>${esc(nm)}${slip.seats&&slip.seats[i]?` <span class="gt">/</span> ${esc(seatLabel(slip.seats[i]))}`:''}</span><button class="rm" data-rm="${i}" aria-label="Remove">\u00d7</button></li>`).join('')}</ul>`
        + `<form class="int-form" id="add-line" hidden autocomplete="off"><span class="inl">name</span><span class="gt">&gt;</span><input class="grow" id="add-name" type="text" aria-label="Add a name" enterkeyhint="done" autocapitalize="words" autocorrect="off" spellcheck="false"><button class="lnk" id="add-go" type="submit">[add]</button></form>`
        + `<div class="slip-foot"><span>${slip.party} ${slip.party===1?'seat':'seats'}</span><span>doors ${esc((C.schedule||{}).doors||'')}</span></div>`
        + `<div class="cal"><a class="lnk" id="cal-go" href="${icsHref()}" target="_blank" rel="noopener">[add to calendar]</a> <button class="lnk cal-alt" id="cal-goog" type="button">[google]</button></div>`
        + `<div class="acts"><button class="lnk" id="change-res">[change]</button><button class="lnk" id="cancel-res">[cancel]</button></div>`
        + msg + `</div>` + locBlk;
    } else if (sessionCode){
      if (sm && rsvpStage === 'seats'){
        const step = (pendIdx+1) + ' / ' + pendNames.length;
        html += `<div class="sec-h">Pick a place<span class="sec-date">${esc(step)}</span></div><hr class="rule">`
          + noteBlk
          + `<div class="seat-who">tap a place for <b>${esc(pendNames[pendIdx]||'')}</b></div>`
          + planBlk('pick')
          + `<div class="acts"><button class="lnk" id="seat-back">[back]</button></div>`
          + msg + locBlk;
      } else if (sm && rsvpStage === 'review'){
        html += `<div class="sec-h">Confirm</div><hr class="rule">`
          + noteBlk + planBlk('pick')
          + `<div class="roster seated">${pendNames.map((nm,i)=>`<div class="cm"><span class="cm-n">${esc(nm)}</span><span class="cm-lead"></span><span class="cm-s">${esc(seatLabel(pendSeats[i]))}</span></div>`).join('')}</div>`
          + `<div class="acts"><button class="lnk" id="seat-restart">[back]</button><button class="lnk" id="seat-confirm">[confirm]</button></div>`
          + msg + locBlk;
      } else {
        html += `<div class="sec-h">Coming?</div><hr class="rule">` + noteBlk + planBlk('view');
        if (rsvpState() === 'closed'){
          html += `<div class="seat-hint">rsvp is closed for this screening.</div>` + msg + locBlk;
        } else {
          html += (sm ? `<div class="seat-hint">add name(s), then you'll pick a place for each</div>` : '')
          + `<form id="admit-form" autocomplete="off">`
          + `<div class="rows" id="name-rows"><div class="row"><span class="inl">name</span><span class="gt">&gt;</span><input class="grow rn" type="text" required aria-label="Name" enterkeyhint="send" autocapitalize="words" autocorrect="off" spellcheck="false"></div></div>`
          + `<div class="addmore"><button type="button" class="lnk" id="add-row">+ add another person</button></div>`
          + `<div class="hp" aria-hidden="true"><input id="website" type="text" tabindex="-1" autocomplete="off"></div>`
          + `<div class="acts"><button class="lnk" type="submit" id="confirm-go">${sm?'[continue]':'[confirm]'}</button></div>`
          + msg + `</form>` + locBlk;
        }
      }
    } else {
      html += `<form id="unlock-form" autocomplete="off">`
        + `<div class="line"><span class="inl">code</span><span class="gt">&gt;</span><input class="grow" id="code" type="text" required aria-label="Code" enterkeyhint="go" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"></div>`
        + `<div class="hp" aria-hidden="true"><input id="u-hp" type="text" tabindex="-1" autocomplete="off"></div>`
        + `<div class="acts"><button class="lnk" type="submit" id="unlock-go">[enter]</button></div>`
        + msg + `</form>`;
    }

    body.innerHTML = html;
    if (admInited){ const f = $('#code') || $('.rn'); if (f && f.focus){ try{ f.focus({ preventScroll:true }); }catch(_){ try{ f.focus(); }catch(__){} } } }
    admInited = true;
  }

  function reveal(g){ gated = g; renderVenue(); renderCurrent(); }

  async function unlockSession(form){
    const code = form.querySelector('#code').value.trim();
    const hp = form.querySelector('#u-hp').value;
    if (hp) return;
    if (!code) return admitMsg('enter code', 'err');
    const go = form.querySelector('#unlock-go'); go.disabled = true; admitMsg('', 'ok');
    try{
      const d = await post('unlock', { code, website:hp, date: (CUR && CUR.date) || '' });
      sessionCode = code;
      roster = d.coming || [];
      if (d.seatMap) seatMap = d.seatMap;
      if (typeof d.confirmed === 'number') agg = { confirmed:d.confirmed, capacity:d.capacity };
      reveal({ venue:d.venue, houseNote:d.houseNote });
      renderAdmission(); renderCurrent();
      admitMsg('', 'ok'); track('code');
    }catch(err){ admitMsg(err.message, 'err'); go.disabled = false; }
  }

  function roomPlanHtml(mode){
    mode = mode || 'pick';
    const open = openSeats();
    const cell = obj => {
      const ids = open.filter(id => String(id).split('-')[0] === obj);
      if (!ids.length) return '';
      const boxes = ids.map(id => {
        const chosen = mode === 'pick' && pendSeats.indexOf(id) >= 0;
        const taken = seatTaken(id) && !chosen;
        const mine = mode === 'view' && slip && slip.seats && slip.seats.indexOf(id) >= 0;
        const cls = (taken ? 'taken' : (chosen ? 'sel' : 'avail')) + (mine ? ' mine' : '');
        const dis = (mode === 'pick' && taken) ? ' disabled' : '';
        return `<button type="button" class="seat ${cls}" data-seat="${esc(id)}"${dis}></button>`;
      }).join('');
      return `<div class="furn"><div class="furn-l">${esc(SEAT_LABEL[obj]||obj)}</div><div class="furn-b">${boxes}</div></div>`;
    };
    const back = ROOM_ORDER.map(cell).filter(Boolean).join('');
    const floor = cell('floor');
    let extra = '';
    if (mode === 'view'){
      const freeN = open.filter(id => !seatTaken(id)).length;
      extra = `<div class="plan-legend"><span class="lg"><span class="lg-box taken"></span>taken</span><span class="lg"><span class="lg-box"></span>free</span>${slip&&slip.seats&&slip.seats.length?`<span class="lg"><span class="lg-box mine"></span>yours</span>`:''}<span class="lg-open">${freeN>0?freeN+' open':'full'}</span></div>`;
    }
    return `<div class="plan${mode==='view'?' plan-view':''}"><div class="plan-row">${back}</div>${floor?`<div class="plan-floor">${floor}</div>`:''}<div class="plan-screen">SCREEN</div>${extra}</div>`;
  }
  function pickSeat(id){
    if (rsvpStage !== 'seats') return;
    if (seatTaken(id) || pendSeats.indexOf(id) >= 0) return;
    pendSeats[pendIdx] = id; pendIdx++;
    if (navigator.vibrate) { try{ navigator.vibrate(8); }catch(_){} }
    if (pendIdx >= pendNames.length) rsvpStage = 'review';
    renderAdmission();
  }
  async function doCreateSeats(){
    const go = $('#seat-confirm'); if (go) go.disabled = true; admitMsg('', 'ok');
    try{
      const d = await post('create', { names:pendNames, seats:pendSeats, code:sessionCode, date:CUR.date, title:CUR.title });
      mine = { reservationId:d.reservationId, editToken:d.editToken }; store.set(mine);
      slip = { names:d.names, party:d.party, date:CUR.date, seats:d.seats };
      agg = { confirmed:d.confirmed, capacity:d.capacity }; roster = d.coming || roster;
      if (d.seatMap) seatMap = d.seatMap;
      reveal({ venue:d.venue, houseNote:d.houseNote });
      rsvpStage = 'names'; pendNames = []; pendSeats = []; pendIdx = 0;
      renderAdmission(); admitMsg('recorded', 'ok'); track('rsvp'); showSlip_();
    }catch(err){
      if (/just taken/i.test(err.message)){ await loadState(); rsvpStage='seats'; pendIdx=0; pendSeats=[]; renderAdmission(); admitMsg('a place was just taken, choose again','err'); }
      else { admitMsg(err.message, 'err'); if (go) go.disabled = false; }
    }
  }

  async function confirmAttend(form){
    const names = [...form.querySelectorAll('.rn')].map(i=>i.value.trim()).filter(Boolean);
    const hp = form.querySelector('#website').value;
    if (hp) return;
    if (Date.now() - startedAt < 1500) return admitMsg('one moment', 'err');
    if (!names.length) return admitMsg('add a name', 'err');
    if (names.length > 6) return admitMsg('max 6', 'err');
    if (!sessionCode) return admitMsg('enter code first', 'err');
    if (rsvpState() === 'closed') return admitMsg('rsvp closed', 'err');

    if (seatMode()){
      pendNames = names; pendSeats = []; pendIdx = 0; rsvpStage = 'seats'; renderAdmission(); return;
    }

    const go = form.querySelector('#confirm-go'); go.disabled = true; admitMsg('', 'ok');
    try{
      const d = await post('create', { names, code:sessionCode, website:hp, date:CUR.date, title:CUR.title });
      mine = { reservationId:d.reservationId, editToken:d.editToken }; store.set(mine);
      slip = { names:d.names, party:d.party, date:CUR.date };
      agg = { confirmed:d.confirmed, capacity:d.capacity };
      roster = d.coming || roster;
      reveal({ venue:d.venue, houseNote:d.houseNote });
      renderAdmission();
      admitMsg('recorded', 'ok'); track('rsvp'); showSlip_();
    }catch(err){ admitMsg(err.message, 'err'); go.disabled = false; }
  }
  function showSlip_(){ const s = $('#slip'); if (s && s.scrollIntoView){ try{ s.scrollIntoView({ behavior:'smooth', block:'nearest' }); }catch(_){} } }

  async function saveNames(names){
    const d = await post('update', { reservationId:mine.reservationId, editToken:mine.editToken, names });
    if (d.cancelled){ mine=null; slip=null; store.clear(); if(!sessionCode){ gated=null; roster=null; renderVenue(); } }
    else { slip.names = d.names; slip.party = d.party; }
    if (typeof d.confirmed === 'number') agg = { confirmed:d.confirmed, capacity:d.capacity };
    if (d.coming) roster = d.coming;
    renderAdmission(); renderCurrent();
  }
  async function addName(raw){
    const name = (raw||'').trim(); if(!name) return;
    try{ await saveNames(slip.names.concat(name)); }
    catch(err){ admitMsg(err.message,'err'); }
  }
  async function removeName(i){
    const names = slip.names.slice(); names.splice(i,1);
    try{ await saveNames(names); }
    catch(err){ admitMsg(err.message,'err'); }
  }
  async function cancelRes(){
    try{
      const d = await post('cancel', { reservationId:mine.reservationId, editToken:mine.editToken });
      agg = { confirmed:d.confirmed, capacity:d.capacity };
      if (typeof d !== 'undefined' && d.coming) roster = d.coming;
      mine=null; slip=null; store.clear();
      if (!sessionCode){ gated=null; roster=null; renderVenue(); }
      renderAdmission(); renderCurrent(); admitMsg('cancelled','ok');
    }catch(err){ admitMsg(err.message,'err'); }
  }

  function wireAdmission(){
    const root = $('#admission');
    root.addEventListener('submit', e => {
      if (e.target.id==='unlock-form'){ e.preventDefault(); unlockSession(e.target); }
      else if (e.target.id==='admit-form'){ e.preventDefault(); confirmAttend(e.target); }
      else if (e.target.id==='add-line'){ e.preventDefault(); addName($('#add-name').value); }
    });
    root.addEventListener('click', e => {
      const t = e.target;
      if (t.id === 'add-row'){ const row=document.createElement('div'); row.className='row';
        row.innerHTML='<span class="inl">name</span><span class="gt">&gt;</span><input class="grow rn" type="text" autocomplete="off" aria-label="Name" enterkeyhint="done" autocapitalize="words" autocorrect="off" spellcheck="false"><button type="button" class="rm" data-rmrow="1" aria-label="Remove">\u00d7</button>';
        $('#name-rows').appendChild(row); row.querySelector('.rn').focus(); }
      else if (t.dataset.rmrow){ t.closest('.row').remove(); }
      else if (t.id === 'change-res'){ const s=$('#slip'); if(s){ const on=!s.classList.contains('editing'); s.classList.toggle('editing',on); const f=$('#add-line'); if(f) f.hidden=!on; if(on){ const i=$('#add-name'); if(i) i.focus(); } } }
      else if (t.dataset.rm !== undefined){ removeName(parseInt(t.dataset.rm,10)); }
      else if (t.id === 'cancel-res'){ cancelRes(); }
      else if (t.id === 'cal-go'){ track('calendar'); }
      else if (t.id === 'loc-copy'){ const v=(gated&&gated.venue)||''; if(v){ try{ navigator.clipboard.writeText(v).then(()=>{ const o=t.textContent; t.textContent='copied'; setTimeout(()=>{ t.textContent=o; }, 1200); }); }catch(_){} } }
      else if (t.id === 'cal-goog'){ openGcal(); }
      else if (t.dataset.seat){ pickSeat(t.dataset.seat); }
      else if (t.id === 'seat-back'){ if (pendIdx>0){ pendIdx--; pendSeats.pop(); } else { rsvpStage='names'; } renderAdmission(); }
      else if (t.id === 'seat-restart'){ rsvpStage='seats'; pendIdx=0; pendSeats=[]; renderAdmission(); }
      else if (t.id === 'seat-confirm'){ doCreateSeats(); }
    });
    root.addEventListener('keydown', e => {
      if(e.key==='Escape' && e.target.id==='add-name'){
        const s=$('#slip'), f=$('#add-line'); if(f) f.hidden=true; if(s) s.classList.remove('editing');
      }
    });
  }

  function renderUpcoming(){
    const base = (C.upcoming||[]).filter(u=>u && u.title && u !== PICK.promoted).map((u,idx)=>({u,idx}));
    const dated = base.filter(x=>x.u.date).sort((a,b)=> a.u.date<b.u.date?-1:(a.u.date>b.u.date?1:a.idx-b.idx));
    const undated = base.filter(x=>!x.u.date).sort((a,b)=>{ const va=interestCounts[a.u.title]||0, vb=interestCounts[b.u.title]||0; return (vb-va) || (a.idx-b.idx); });
    const list = dated.concat(undated).map(x=>x.u);
    $('#upcoming').innerHTML = `
      <div class="sec-h">Upcoming</div><hr class="rule">
      <div class="up">
        ${list.length ? list.map(u=>{
          const c = interestCounts[u.title] || 0;
          const voted = hasVoted(u.title);
          return `
          <div class="up-film">
            ${u.date ? `<div class="up-date">${esc(fmt(u.date,{weekday:'short',day:'numeric',month:'short'})).toUpperCase()}</div>` : ''}
            <div class="title">${esc(u.title)}</div>
            <div class="meta">${esc([u.director,u.year].filter(Boolean).join(' / '))}</div>
            ${u.runtime ? `<div class="meta">${rt(u.runtime,'prime')}</div>` : ''}
            ${u.rec ? `<div class="rec">rec: <span>${esc(u.rec)}</span></div>` : ''}
            ${u.away ? `<div class="tags"><span class="tag">away screening</span></div>` : ''}
            ${u.synopsis ? `<p class="syn">${esc(u.synopsis)}</p>` : ''}
            <div class="int" data-film="${esc(u.title)}">
              <button class="int-btn"${voted?' disabled':''} aria-expanded="false"><span class="int-label">interested${voted?' \u2713':''}</span><span class="int-rule"></span><span class="int-n">${c}</span></button>
              <form class="int-form" hidden autocomplete="off"><span class="inl">name</span><span class="gt">&gt;</span><input class="grow ni-name" type="text" aria-label="Your name" enterkeyhint="send" autocapitalize="words" autocorrect="off" spellcheck="false"><input class="nhp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="lnk int-go" type="submit">[enter]</button></form>
              <div class="nmsg" aria-live="polite"></div>
            </div>
          </div>`;}).join('')
        : `<div class="up-film"><div class="meta">nothing listed</div></div>`}
      </div>`;
  }
  async function sendInterest(box, film){
    const form = box.querySelector('.int-form');
    const name = form.querySelector('.ni-name').value.trim();
    const hp = form.querySelector('.nhp').value;
    const msg = box.querySelector('.nmsg');
    const set = (t,cls)=>{ if(msg){ msg.textContent=t; msg.className='nmsg '+(cls||''); } };
    if (hp) return;
    if (hasVoted(film)) return set('noted','ok');
    if (!name) return set('name?','err');
    if (!EP) return set('offline','err');
    const go = form.querySelector('.int-go'); go.disabled=true;
    try{
      const d = await post('interest', { name, film, website:hp });
      if (d.interest) interestCounts = d.interest; else interestCounts[film] = (interestCounts[film]||0)+1;
      markVoted(film);
      const btn = box.querySelector('.int-btn');
      box.querySelector('.int-n').textContent = interestCounts[film]||0;
      box.querySelector('.int-label').textContent = 'interested \u2713';
      btn.disabled = true; btn.hidden = false; btn.setAttribute('aria-expanded','false');
      form.hidden = true; set('',''); track('interest');
    }catch(err){ set(err.message,'err'); go.disabled=false; }
  }
  function wireUpcoming(){
    const root = $('#upcoming');
    root.addEventListener('click', e => {
      const b = e.target.closest('.int-btn'); if(!b || b.disabled) return;
      const box = b.closest('.int'), form = box.querySelector('.int-form');
      b.hidden = true; form.hidden = false; b.setAttribute('aria-expanded','true');
      form.querySelector('.ni-name').focus();
    });
    root.addEventListener('submit', e => {
      if(!e.target.classList.contains('int-form')) return;
      e.preventDefault(); const box = e.target.closest('.int'); sendInterest(box, box.dataset.film);
    });
    root.addEventListener('keydown', e => {
      if(e.key!=='Escape' || !e.target.classList.contains('ni-name')) return;
      const box=e.target.closest('.int'); if(!box) return;
      const b=box.querySelector('.int-btn'), f=box.querySelector('.int-form');
      f.hidden=true; b.hidden=false; b.setAttribute('aria-expanded','false');
    });
  }

  async function sendWish(form){
    const film = $('#w-film').value.trim(), director = $('#w-dir').value.trim();
    const by = $('#w-by').value.trim(), note = $('#w-note').value.trim(), hp = $('#w-hp').value;
    const present = !!($('#w-present') && $('#w-present').getAttribute('aria-pressed') === 'true');
    const set = (t,cls)=>{ const m=$('#wish-msg'); m.textContent=t; m.className='nmsg '+(cls||''); };
    if (hp) return;
    if (!film) return set('film?','err');
    if (!EP) return set('offline','err');
    const go=$('#wish-go'); go.disabled=true; set('','ok');
    try{ const d = await post('wish', { film, director, by, note, present });
      if (d && d.interest){ interestCounts = d.interest; renderUpcoming(); }
      set(present ? 'recorded, interest noted' : 'recorded','ok'); track('suggest');
      $('#w-film').value=''; $('#w-dir').value=''; $('#w-by').value=''; $('#w-note').value=''; if($('#w-present')){ const b=$('#w-present'); b.setAttribute('aria-pressed','false'); b.textContent="[ ] i'd like to be there when it screens"; } }
    catch(err){ set(err.message,'err'); }
    finally{ go.disabled=false; }
  }

  // ---------- past ----------
  function renderPast(){
    const items = (PICK.retired ? [PICK.retired].concat(C.past||[]) : (C.past||[]))
      .filter(f=> f && f.title)
      .slice().sort((a,b)=> String(b.date||'').localeCompare(String(a.date||'')));
    $('#past').innerHTML = `
      <div class="sec-h">Past</div><hr class="rule">
      <div class="pastlist">
        ${items.map(f=>{
          const priv = !!f.private, away = !!f.away;
          const tags = []; if (away) tags.push('away screening'); if (priv) tags.push('private');
          const tagsHtml = tags.length ? `<div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>` : '';
          const att = (f.attendees||[]).filter(Boolean);
          const present = priv ? '' : (att.length
            ? `<div class="att"><span class="att-count">${att.length}</span> attended <button class="peek" aria-expanded="false">[show]</button> <span class="att-names">${att.map(esc).join(' / ')}</span></div>`
            : (typeof f.attendance==='number' ? `<div class="att"><span class="att-count">${f.attendance}</span> attended</div>` : ''));
          return `
          <div class="entry${priv?' priv':''}">
            <div class="dt">${esc(fmt(f.date,{day:'2-digit',month:'short',year:'numeric'})).toUpperCase()}</div>
            <div class="title">${esc(f.title)}</div>
            <div class="meta">${esc([f.director,f.year].filter(Boolean).join(' / '))}</div>
            ${f.runtime ? `<div class="meta">${rt(f.runtime,'prime')}</div>` : ''}
            ${f.rec ? `<div class="rec">rec: <span>${esc(f.rec)}</span></div>` : ''}
            ${tagsHtml}
            ${present}
          </div>`;
        }).join('')}
      </div>`;
  }

  // ---------- suggest a film ----------
  function renderSuggest(){
    const el = $('#suggest'); if(!el) return;
    el.innerHTML = `
      <button class="lnk" id="wish-toggle" aria-expanded="false">+ suggest a film</button>
      <form class="sug-form" id="wish-form" hidden autocomplete="off">
        <div class="line"><span class="inl">film</span><span class="gt">&gt;</span><input class="grow" id="w-film" type="text" required aria-label="Film" enterkeyhint="next" autocapitalize="words" autocorrect="off"></div>
        <div class="line"><span class="inl">director</span><span class="gt">&gt;</span><input class="grow" id="w-dir" type="text" aria-label="Director" enterkeyhint="next" autocapitalize="words" autocorrect="off"></div>
        <div class="line"><span class="inl">name</span><span class="gt">&gt;</span><input class="grow" id="w-by" type="text" aria-label="Your name" enterkeyhint="next" autocapitalize="words" autocorrect="off" spellcheck="false"></div>
        <div class="line"><span class="inl">note</span><span class="gt">&gt;</span><input class="grow" id="w-note" type="text" aria-label="Note" enterkeyhint="send" autocapitalize="sentences"></div>
        <button type="button" class="lnk present-toggle" id="w-present" aria-pressed="false">[ ] i'd like to be there when it screens</button>
        <div class="hp" aria-hidden="true"><input id="w-hp" type="text" tabindex="-1" autocomplete="off"></div>
        <div class="acts"><button class="lnk" type="submit" id="wish-go">[send]</button></div>
        <div class="nmsg" id="wish-msg" aria-live="polite"></div>
      </form>`;
  }
  function wireSuggest(){
    const el = $('#suggest');
    el.addEventListener('click', e => {
      if (e.target.id === 'w-present'){
        const on = e.target.getAttribute('aria-pressed') !== 'true';
        e.target.setAttribute('aria-pressed', on ? 'true' : 'false');
        e.target.textContent = (on ? '[x]' : '[ ]') + " i'd like to be there when it screens";
        return;
      }
      if (e.target.id !== 'wish-toggle') return;
      const f=$('#wish-form'); const open=f.hidden; f.hidden=!open;
      e.target.setAttribute('aria-expanded', String(open)); if(open) $('#w-film').focus(); });
    el.addEventListener('submit', e => { if(e.target.id!=='wish-form') return; e.preventDefault(); sendWish(e.target); });
  }

  function wirePeek(){
    $('#past').addEventListener('click', e => {
      const b = e.target.closest('.peek'); if(!b) return;
      const on = b.closest('.att').classList.toggle('revealed');
      b.textContent = on ? '[hide]' : '[show]';
      b.setAttribute('aria-expanded', String(on));
    });
  }

  // ---------- live aggregate + restore own reservation ----------
  async function loadState(){
    if (!EP) return;
    const q = (CUR && CUR.date) ? ('?date=' + encodeURIComponent(CUR.date)) : '';
    try{ const r = await fetch(EP + q); const d = await r.json();
      if (d && d.interest){ interestCounts = d.interest; renderUpcoming(); }
      if (d && Array.isArray(d.taken)) takenIds = d.taken;
      if (d && typeof d.confirmed==='number'){ agg={confirmed:d.confirmed, capacity:d.capacity}; renderCurrent(); } }catch(_){}
  }
  async function restoreMine(){
    if (!EP || !mine) return;
    try{
      const d = await post('mine', { reservationId:mine.reservationId, editToken:mine.editToken, date: (CUR && CUR.date) || '' });
      if (d.stale){ mine=null; store.clear(); renderAdmission(); return; }
      slip = { names:d.names, party:d.party, date:d.date, seats:d.seats };
      if (d.seatMap) seatMap = d.seatMap;
      if (typeof d.confirmed==='number') agg={confirmed:d.confirmed, capacity:d.capacity};
      roster = d.coming || null;
      reveal({ venue:d.venue, houseNote:d.houseNote });
      renderAdmission(); renderCurrent();
    }catch(_){ mine=null; store.clear(); renderAdmission(); }
  }

  // ---------- init ----------
  renderChrome(); renderVenue(); renderCurrent(); renderAdmission(); renderUpcoming(); renderSuggest(); renderPast();
  setInterval(renderCountdown, 30000);
  wireAdmission(); wireUpcoming(); wireSuggest(); wirePeek();
  loadState(); restoreMine(); track('open');
})();
</script>
</body>
</html>
