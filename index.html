<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heimkino</title>
<meta name="description" content="Heimkino is a small, invitation-only screening programme in Berlin.">
<meta name="theme-color" content="#0d0d0f">
<meta property="og:site_name" content="Heimkino">
<meta property="og:title" content="Heimkino">
<meta property="og:description" content="An invitation-only screening programme in Berlin.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Heimkino">
<meta name="twitter:description" content="An invitation-only screening programme in Berlin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<!-- All PUBLIC content lives in config.js. Secrets (invite code, address, house note) live in the backend. -->
<script src="config.js"></script>

<style>
  :root{
    --ground:#0d0d0f;
    --light:#edece6;
    --muted:#9296a0;          /* lifted for contrast on small mono text */
    --faint:#5a5c63;
    --line:rgba(237,236,230,0.15);
    --accent:#edece6;         /* overridden per screening from config */
    --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
    --mono:"Space Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --u:8px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  ::selection{ background:var(--accent); color:var(--ground); }
  body{
    background:var(--ground); color:var(--light);
    font-family:var(--serif); line-height:1.35;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 18%, rgba(30,30,34,0.55) 0%, rgba(13,13,15,0) 55%),
      radial-gradient(140% 120% at 50% 100%, rgba(0,0,0,0.9) 0%, rgba(13,13,15,0) 60%);
  }
  .wrap{ position:relative; z-index:1; max-width:720px; margin:0 auto; padding:calc(var(--u)*6) calc(var(--u)*3) calc(var(--u)*16); }

  .mono{ font-family:var(--mono); }
  .label{ font-family:var(--mono); font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); }

  /* ---- masthead ---- */
  header{ padding-bottom:calc(var(--u)*4); border-bottom:1px solid var(--line); }
  .mark{ font-family:var(--mono); font-weight:700; font-size:15px; letter-spacing:0.42em; }
  .mark small{ display:block; font-weight:400; font-size:11px; letter-spacing:0.22em; color:var(--muted); margin-top:9px; }
  .head-loc{ margin-top:calc(var(--u)*1.75); min-height:14px; }
  .head-loc .head-loc-v{ display:none; font-family:var(--mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); }
  .head-loc.revealed .head-loc-v{ display:inline; }
  .head-loc.revealed .redact{ display:none; }

  section{ padding-top:calc(var(--u)*9); }
  .sec-label{ font-family:var(--mono); font-size:11px; letter-spacing:0.24em; text-transform:uppercase; color:var(--muted); }

  /* ---- current screening (compact) ---- */
  .cur-date{ font-family:var(--mono); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-top:calc(var(--u)*1.5); }
  .cur-title{ font-family:var(--serif); font-weight:400; font-size:clamp(30px,5.5vw,52px); line-height:1.02;
    letter-spacing:-0.01em; margin-top:calc(var(--u)*1); }
  .cur-meta{ font-family:var(--mono); font-size:12px; letter-spacing:0.06em; color:var(--muted); margin-top:calc(var(--u)*1.5); }
  .cur-syn{ font-family:var(--serif); font-size:20px; line-height:1.5; color:#d8d7d0; margin-top:calc(var(--u)*2.5); max-width:46ch; }
  .cur-run{ font-family:var(--mono); font-size:12px; letter-spacing:0.08em; color:var(--muted); margin-top:calc(var(--u)*2.5); }

  /* gated blocks: redacted until the invitation is entered (fetched from backend) */
  .gated{ margin-top:calc(var(--u)*3); display:grid; gap:calc(var(--u)*2.5); max-width:440px; }
  .g-item .k{ font-family:var(--mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .redact{ display:inline-block; height:15px; border-radius:1px; background:repeating-linear-gradient(90deg,var(--faint) 0 10px,transparent 10px 13px); opacity:.65; }
  .g-item .v{ font-family:var(--serif); font-size:19px; color:var(--light); }
  .g-item.locked .v{ display:none; }
  .g-item:not(.locked) .redact{ display:none; }

  /* count */
  .count{ margin-top:calc(var(--u)*3); font-family:var(--mono); font-size:12px; letter-spacing:0.08em; color:var(--muted); }
  .count b{ color:var(--accent); font-weight:700; font-size:14px; }
  .coming{ margin-top:calc(var(--u)*3); max-width:460px; }
  .coming .k{ font-family:var(--mono); font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); margin-bottom:9px; }
  .coming-names{ font-family:var(--serif); font-size:19px; line-height:1.5; color:var(--light); }

  /* ---- admission ---- */
  .admit{ margin-top:calc(var(--u)*3); max-width:440px; }
  .field{ margin-bottom:calc(var(--u)*2.5); }
  .field > label{ display:block; font-family:var(--mono); font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  input[type=text], input[type=email]{ width:100%; background:transparent; color:var(--light);
    border:none; border-bottom:1px solid var(--line); font-family:var(--serif); font-size:22px; padding:6px 0; }
  input:focus{ outline:none; border-color:var(--accent); }
  input::placeholder{ color:#45464c; }
  .namerow{ display:flex; align-items:baseline; gap:12px; margin-bottom:10px; }
  .namerow input{ flex:1; }
  .hp{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }

  button{ font-family:var(--mono); cursor:pointer; }
  .btn{ display:inline-block; background:var(--light); color:var(--ground); border:none;
    font-size:12px; letter-spacing:0.16em; text-transform:uppercase; padding:13px 22px; transition:filter .2s; }
  .btn:hover:not(:disabled){ filter:invert(1) saturate(0); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .ghost{ background:none; border:1px solid var(--line); color:var(--light);
    font-size:11px; letter-spacing:0.12em; text-transform:uppercase; padding:9px 14px; transition:background .2s,color .2s; }
  .ghost:hover:not(:disabled){ background:var(--light); color:var(--ground); }
  .ghost:disabled{ opacity:.4; cursor:not-allowed; }
  .textbtn{ background:none; border:none; color:var(--muted); font-size:11px; letter-spacing:0.1em;
    text-transform:uppercase; padding:0; border-bottom:1px solid var(--line); }
  .textbtn:hover{ color:var(--light); border-color:var(--light); }
  .actions{ display:flex; gap:14px; align-items:center; margin-top:calc(var(--u)*1.5); flex-wrap:wrap; }
  .msg{ font-family:var(--mono); font-size:12px; margin-top:12px; min-height:16px; letter-spacing:0.03em; }
  .msg.ok{ color:var(--light); } .msg.err{ color:#c98b8b; }

  /* admission slip */
  .slip{ border:1px solid var(--line); padding:calc(var(--u)*3); max-width:440px; position:relative; }
  .slip::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--accent); }
  .slip .sh{ font-family:var(--mono); font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:var(--accent); }
  .slip ul{ list-style:none; margin:calc(var(--u)*2) 0 0; }
  .slip li{ font-family:var(--serif); font-size:23px; padding:7px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; }
  .slip li .rm{ font-family:var(--mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); background:none; border:none; border-bottom:1px solid transparent; }
  .slip li .rm:hover{ color:#c98b8b; border-color:#c98b8b; }
  .slip .seats{ font-family:var(--mono); font-size:12px; letter-spacing:0.1em; color:var(--muted); margin-top:calc(var(--u)*2); }
  .slip .when{ font-family:var(--mono); font-size:12px; letter-spacing:0.08em; color:var(--muted); margin-top:6px; }
  .addrow{ display:flex; gap:12px; align-items:baseline; margin-top:calc(var(--u)*2); }
  .addrow input{ flex:1; font-size:18px; }

  /* host note (revealed, gated) - the human voice */
  .hnote{ font-family:var(--serif); font-size:19px; color:#d8d7d0; line-height:1.5; }

  /* ---- programme (upcoming) ---- */
  .prow{ display:grid; grid-template-columns:96px 1fr; gap:calc(var(--u)*3); padding:calc(var(--u)*2.5) 0; border-bottom:1px solid var(--line); }
  .prow .idx{ font-family:var(--mono); font-size:11px; letter-spacing:0.14em; color:var(--faint); padding-top:6px; }
  .prow .t{ font-family:var(--serif); font-size:26px; line-height:1.05; }
  .prow .m{ font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:5px; }
  .notify{ margin-top:12px; background:none; border:none; color:var(--muted); font-family:var(--mono);
    font-size:11px; letter-spacing:0.1em; text-transform:uppercase; padding:0; border-bottom:1px solid var(--line); }
  .notify:hover, .notify:focus-visible{ color:var(--light); border-color:var(--light); outline:none; }
  .nform{ margin-top:14px; display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; max-width:440px; }
  .nform input{ flex:1 1 150px; font-size:17px; }
  .nform .nhp{ position:absolute; left:-9999px; width:1px; height:1px; }
  .nmsg{ flex-basis:100%; font-family:var(--mono); font-size:11px; color:var(--muted); min-height:14px; }
  .nmsg.ok{ color:var(--light); } .nmsg.err{ color:#c98b8b; }

  /* wish for a film */
  .wish{ margin-top:calc(var(--u)*4); padding-top:calc(var(--u)*3); border-top:1px solid var(--line); }
  .wform{ margin-top:calc(var(--u)*2); max-width:440px; display:grid; gap:calc(var(--u)*1.5); }
  .wrow{ display:flex; gap:14px; flex-wrap:wrap; }
  .wrow input{ flex:1 1 150px; }
  .whp{ position:absolute; left:-9999px; width:1px; height:1px; }

  /* ---- archive: numbered spine, restrained interaction ---- */
  .arch{ margin-top:calc(var(--u)*3.5); position:relative; padding-left:calc(var(--u)*3.5); }
  .arch::before{ content:""; position:absolute; left:5px; top:10px; bottom:10px; width:1px; background:var(--line); }
  .entry{ position:relative; padding:calc(var(--u)*2.5) 0; border-bottom:1px solid var(--line); }
  .entry::before{ content:""; position:absolute; left:calc(var(--u)*-3.5 + 1px); top:calc(var(--u)*3);
    width:9px; height:9px; border-radius:50%; background:var(--ground); border:1px solid var(--muted);
    transition:background .2s, border-color .2s, transform .2s; }
  .entry:hover::before, .entry:focus-within::before{ background:var(--ea, var(--light)); border-color:var(--ea, var(--light)); }
  .entry .hd{ display:flex; gap:calc(var(--u)*2); align-items:baseline; }
  .entry .no{ font-family:var(--mono); font-size:12px; letter-spacing:0.12em; color:var(--ea, var(--muted)); }
  .entry .dt{ font-family:var(--mono); font-size:12px; letter-spacing:0.08em; color:var(--muted); }
  .entry .t{ font-family:var(--serif); font-size:27px; line-height:1.05; margin-top:6px; transition:transform .2s; }
  .entry:hover .t{ transform:translateX(3px); }
  .entry .t span{ font-family:var(--mono); font-size:13px; color:var(--muted); }
  .entry .dir{ font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:3px; }
  .entry .syn{ font-family:var(--serif); font-style:italic; font-size:16px; color:#c3c2bb; margin-top:9px; max-width:52ch; line-height:1.4; }
  .entry .att{ font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-top:11px;
    display:flex; align-items:center; gap:10px; }
  .att-label{ color:var(--muted); }
  .peek{ display:inline-flex; align-items:center; justify-content:center; width:26px; height:18px; padding:0;
    background:none; border:none; cursor:pointer; color:var(--muted); touch-action:none; -webkit-user-select:none; user-select:none; }
  .peek:hover, .peek:focus-visible{ color:var(--light); outline:none; }
  .peek svg{ width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .att-count{ color:var(--muted); }
  .att-names{ display:none; color:var(--light); text-transform:none; letter-spacing:0.02em; font-size:12px; }
  .att.revealed .att-count{ display:none; }
  .att.revealed .att-names{ display:inline; }

  footer{ margin-top:calc(var(--u)*16); padding-top:calc(var(--u)*3); border-top:1px solid var(--line);
    font-family:var(--mono); font-size:11px; letter-spacing:0.1em; color:var(--muted); }
  .foot-loc{ margin-bottom:calc(var(--u)*2.5); min-height:15px; }
  .foot-loc .foot-loc-v{ display:none; color:var(--light); letter-spacing:0.08em; text-transform:uppercase; }
  .foot-loc.revealed .foot-loc-v{ display:inline; }
  .foot-loc.revealed .redact{ display:none; }
  .foot-row{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; }

  @media (max-width:560px){
    .prow{ grid-template-columns:1fr; gap:6px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; animation:none !important; }
    html{ scroll-behavior:auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark" id="mark">HEIMKINO</div>
    <div class="head-loc" id="head-loc">
      <span class="redact" style="width:200px"></span>
      <span class="head-loc-v" id="head-loc-v"></span>
    </div>
  </header>

  <section id="current"></section>

  <section id="admission">
    <div id="admit-body"></div>
  </section>

  <section id="upcoming"></section>
  <section id="past"></section>

  <footer>
    <div class="foot-loc" id="foot-loc">
      <span class="redact" style="width:240px"></span>
      <span class="foot-loc-v" id="foot-loc-v"></span>
    </div>
    <div class="foot-row">
      <span id="foot-left"></span>
      <span id="foot-right"></span>
    </div>
  </footer>
</div>

<script>
(function(){
  const C = window.CONFIG;
  const EP = (C.endpoint || '').trim();
  const startedAt = Date.now();
  const $ = (s, r=document) => r.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pad = n => String(n).padStart(2,'0');
  const fmt = (iso, opts) => { const d = new Date(iso + 'T00:00:00'); return isNaN(d) ? iso : d.toLocaleDateString('en-GB', opts); };

  // localStorage holds ONLY opaque reservation tokens for this browser's own reservation
  const KEY = 'heimkino:res';
  const store = {
    get(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(_){ return null; } },
    set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(_){ } },
    clear(){ try{ localStorage.removeItem(KEY); }catch(_){ } }
  };

  let mine  = store.get();     // { reservationId, editToken } or null
  let slip  = null;            // { names[], party, date } - this user's reservation
  let gated = null;            // { venue, houseNote } - from backend only, never persisted
  let agg   = null;            // { confirmed, capacity }
  let sessionCode = null;      // the invitation code, held in memory once unlocked (not persisted)
  let roster = null;           // [names] of who is coming - only after unlock

  async function post(action, payload){
    if (!EP) throw new Error('Reservations are not connected yet.');
    const r = await fetch(EP, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({ action }, payload)) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Something went wrong.');
    return d;
  }

  // ---------- masthead + footer ----------
  function renderChrome(){
    $('#mark').firstChild.nodeValue = C.wordmark;
    $('#foot-left').textContent = C.wordmark;
    $('#foot-right').textContent = '';
    document.title = C.wordmark + ' \u00b7 ' + C.next.title;
  }

  // label-free redacted location banners (header + footer); revealed only when unlocked
  function renderVenue(){
    const v = (gated && gated.venue) ? gated.venue : '';
    [['#head-loc','#head-loc-v'], ['#foot-loc','#foot-loc-v']].forEach(([b,val])=>{
      const el = $(b); if(!el) return;
      if (v){ el.classList.add('revealed'); $(val).textContent = v; }
      else { el.classList.remove('revealed'); $(val).textContent = ''; }
    });
  }

  // ---------- current screening ----------
  function countText(){
    if (!EP) return '';
    if (!agg) return 'Loading';
    const cap = (agg.capacity!=null) ? ' / ' + pad(agg.capacity) : '';
    return '<b>' + pad(agg.confirmed) + '</b>' + cap + ' confirmed';
  }
  function renderCurrent(){
    const n = C.next, sch = C.schedule || {};
    const meta = [n.director, n.year, n.edition, n.runtime].filter(Boolean).join(' / ');
    const filmStart = n.time || sch.film || '';
    const unlocked = !!gated;
    const run = [ ['Doors', sch.doors], ['Trailers', sch.trailers], ['Film', filmStart] ]
      .filter(x => x[1]).map(x => x[0] + ' ' + esc(x[1])).join('  \u00b7  ');
    const attendance = (gated && roster && roster.length)
      ? `<div class="coming"><div class="k">Coming, ${roster.length}</div><div class="coming-names">${roster.map(esc).join(' \u00b7 ')}</div></div>`
      : `<div class="count">${countText()}</div>`;

    $('#current').innerHTML = `
      <div class="sec-label">Next screening</div>
      <div class="cur-date">${esc(fmt(n.date,{weekday:'short',day:'2-digit',month:'short',year:'numeric'}))}</div>
      <h1 class="cur-title">${esc(n.title || 'To be announced')}</h1>
      <div class="cur-meta">${esc(meta)}</div>
      ${n.synopsis ? `<p class="cur-syn">${esc(n.synopsis)}</p>` : ''}
      <div class="cur-run">${run}</div>
      <div class="gated">
        <div class="g-item ${unlocked?'':'locked'}" id="g-note">
          <div class="k">House note</div>
          <span class="redact" style="width:300px"></span>
          <div class="v hnote">${esc(gated?gated.houseNote:'')}</div>
        </div>
      </div>
      ${attendance}`;
  }

  // ---------- admission ----------
  function admitMsg(t, cls){ const m = $('#admit-msg'); if(m){ m.textContent = t; m.className = 'msg ' + (cls||''); } }

  function renderAdmission(){
    const body = $('#admit-body'); if(!body) return;

    if (!EP){
      body.innerHTML = `<p class="cur-syn" style="font-size:18px">Reservations open once the invitation system is connected.</p>`;
      return;
    }

    // has a reservation -> admission slip
    if (slip){
      body.innerHTML = `
        <div class="slip">
          <div class="sh">Admitted</div>
          <ul id="slip-names">
            ${slip.names.map((nm,i)=>`<li><span>${esc(nm)}</span><button class="rm" data-rm="${i}" aria-label="Remove ${esc(nm)}">remove</button></li>`).join('')}
          </ul>
          <div class="addrow">
            <input id="add-name" type="text" placeholder="add a name" autocomplete="off" aria-label="Add a name">
            <button class="ghost" id="add-go">Add</button>
          </div>
          <div class="seats">${slip.party} ${slip.party===1?'seat':'seats'}</div>
          <div class="when">${esc(fmt(slip.date||C.next.date,{day:'2-digit',month:'short',year:'numeric'}).toUpperCase())} \u00b7 Doors ${esc(C.schedule.doors||'')}</div>
          <div class="actions" style="margin-top:calc(var(--u)*2.5)">
            <button class="textbtn" id="cancel-res">Cancel reservation</button>
          </div>
          <div class="msg" id="admit-msg" role="status" aria-live="polite"></div>
        </div>`;
      return;
    }

    // unlocked for this session -> RSVP form (no code field; the session is already open)
    if (sessionCode){
      body.innerHTML = `
        <form id="admit-form" autocomplete="off">
          <div class="field">
            <label>Who is coming</label>
            <div id="name-rows"><div class="namerow"><input class="rn" type="text" placeholder="name" required aria-label="Name"></div></div>
            <button type="button" class="ghost" id="add-row" style="margin-top:6px">Add someone</button>
          </div>
          <div class="hp" aria-hidden="true"><label>Leave empty</label><input id="website" type="text" tabindex="-1" autocomplete="off"></div>
          <div class="actions"><button class="btn" type="submit" id="confirm-go">Confirm attendance</button></div>
          <div class="msg" id="admit-msg" role="status" aria-live="polite"></div>
        </form>`;
      return;
    }

    // locked -> invitation entry; a valid code opens the session
    body.innerHTML = `
      <form id="unlock-form" autocomplete="off">
        <div class="field">
          <label for="code">Invitation</label>
          <input id="code" type="text" placeholder="required" required aria-label="Invitation code">
        </div>
        <div class="hp" aria-hidden="true"><label>Leave empty</label><input id="u-hp" type="text" tabindex="-1" autocomplete="off"></div>
        <div class="actions"><button class="btn" type="submit" id="unlock-go">Enter</button></div>
        <div class="msg" id="admit-msg" role="status" aria-live="polite"></div>
      </form>`;
  }

  function reveal(g){ gated = g; renderVenue(); renderCurrent(); }

  // the invitation opens the session: reveals location, house note and roster, and enables RSVP
  async function unlockSession(form){
    const code = form.querySelector('#code').value.trim();
    const hp = form.querySelector('#u-hp').value;
    if (hp) return;
    if (!code) return admitMsg('Enter your invitation.', 'err');
    const go = form.querySelector('#unlock-go'); go.disabled = true; admitMsg('Checking\u2026', 'ok');
    try{
      const d = await post('unlock', { code, website:hp });
      sessionCode = code;
      roster = d.coming || [];
      reveal({ venue:d.venue, houseNote:d.houseNote });
      renderAdmission();
      admitMsg('Welcome in.', 'ok');
    }catch(err){ admitMsg(err.message, 'err'); go.disabled = false; }
  }

  async function confirmAttend(form){
    const names = [...form.querySelectorAll('.rn')].map(i=>i.value.trim()).filter(Boolean);
    const hp = form.querySelector('#website').value;
    if (hp) return;
    if (Date.now() - startedAt < 1500) return admitMsg('One moment, then try again.', 'err');
    if (!names.length) return admitMsg('Add at least one name.', 'err');
    if (names.length > 6) return admitMsg('Up to 6 per reservation.', 'err');
    if (!sessionCode) return admitMsg('Enter your invitation first.', 'err');

    const go = form.querySelector('#confirm-go'); go.disabled = true; admitMsg('Confirming\u2026', 'ok');
    try{
      const d = await post('create', { names, code:sessionCode, website:hp, date:C.next.date, title:C.next.title });
      mine = { reservationId:d.reservationId, editToken:d.editToken }; store.set(mine);
      slip = { names:d.names, party:d.party, date:C.next.date };
      agg = { confirmed:d.confirmed, capacity:d.capacity };
      roster = d.coming || roster;
      reveal({ venue:d.venue, houseNote:d.houseNote });
      renderAdmission();
      admitMsg('Confirmed.', 'ok');
    }catch(err){ admitMsg(err.message, 'err'); go.disabled = false; }
  }

  async function saveNames(names){
    const d = await post('update', { reservationId:mine.reservationId, editToken:mine.editToken, names });
    if (d.cancelled){ mine=null; slip=null; store.clear(); if(!sessionCode){ gated=null; roster=null; renderVenue(); } }
    else { slip.names = d.names; slip.party = d.party; }
    if (typeof d.confirmed === 'number') agg = { confirmed:d.confirmed, capacity:d.capacity };
    if (d.coming) roster = d.coming;
    renderAdmission(); renderCurrent();
  }
  async function addName(raw){
    const name = (raw||'').trim(); if(!name) return;
    try{ await saveNames(slip.names.concat(name)); admitMsg('Added '+name+'.','ok'); }
    catch(err){ admitMsg(err.message,'err'); }
  }
  async function removeName(i){
    const names = slip.names.slice(); names.splice(i,1);
    try{ await saveNames(names); admitMsg('Updated.','ok'); }
    catch(err){ admitMsg(err.message,'err'); }
  }
  async function cancelRes(){
    try{
      const d = await post('cancel', { reservationId:mine.reservationId, editToken:mine.editToken });
      agg = { confirmed:d.confirmed, capacity:d.capacity };
      if (typeof d !== 'undefined' && d.coming) roster = d.coming;
      mine=null; slip=null; store.clear();
      if (!sessionCode){ gated=null; roster=null; renderVenue(); }   // re-lock if the session was opened only by a stored reservation
      renderAdmission(); renderCurrent(); admitMsg('Your reservation is cancelled.','ok');
    }catch(err){ admitMsg(err.message,'err'); }
  }

  function wireAdmission(){
    const root = $('#admission');
    root.addEventListener('submit', e => {
      if (e.target.id==='unlock-form'){ e.preventDefault(); unlockSession(e.target); }
      else if (e.target.id==='admit-form'){ e.preventDefault(); confirmAttend(e.target); }
    });
    root.addEventListener('click', e => {
      const t = e.target;
      if (t.id === 'add-row'){ const row=document.createElement('div'); row.className='namerow';
        row.innerHTML='<input class="rn" type="text" placeholder="name" autocomplete="off" aria-label="Name"><button type="button" class="rm ghost" data-rmrow="1">remove</button>';
        $('#name-rows').appendChild(row); row.querySelector('.rn').focus(); }
      else if (t.dataset.rmrow){ t.closest('.namerow').remove(); }
      else if (t.id === 'add-go'){ addName($('#add-name').value); }
      else if (t.dataset.rm !== undefined){ removeName(parseInt(t.dataset.rm,10)); }
      else if (t.id === 'cancel-res'){ cancelRes(); }
    });
    root.addEventListener('keydown', e => { if (e.key==='Enter' && e.target.id==='add-name'){ e.preventDefault(); addName(e.target.value); } });
  }

  // ---------- upcoming ----------
  function renderUpcoming(){
    const list = (C.upcoming||[]).filter(u=>u && u.title);
    $('#upcoming').innerHTML = `
      <div class="sec-label">Upcoming</div>
      <div style="margin-top:calc(var(--u)*2)">
        ${list.length ? list.map((u,i)=>`
          <div class="prow">
            <div class="idx">${u.date ? esc(fmt(u.date,{day:'2-digit',month:'short'})) : 'TBC'}</div>
            <div>
              <div class="t">${esc(u.title)}</div>
              <div class="m">${esc([u.director,u.year].filter(Boolean).join(' / '))}</div>
              <form class="nform" id="nf-${i}" hidden>
                <input class="ni-name" type="text" placeholder="name" autocomplete="off" aria-label="Name">
                <input class="ni-email" type="email" placeholder="email" autocomplete="off" aria-label="Email">
                <input class="nhp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
                <button class="ghost ni-go" type="submit" data-film="${esc(u.title)}">Notify me</button>
                <div class="nmsg" aria-live="polite"></div>
              </form>
            </div>
          </div>`).join('')
        : `<div class="prow"><div class="idx"></div><div class="m">Nothing provisional yet.</div></div>`}
      </div>`;
  }
  async function sendInterest(form, film){
    const name = form.querySelector('.ni-name').value.trim();
    const email = form.querySelector('.ni-email').value.trim();
    const hp = form.querySelector('.nhp').value;
    const msg = form.querySelector('.nmsg');
    const set = (t,cls)=>{ msg.textContent=t; msg.className='nmsg '+(cls||''); };
    if (hp) return;
    if (!name) return set('Add a name.','err');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return set('Add a valid email.','err');
    if (!EP) return set('Not connected yet.','err');
    const go = form.querySelector('.ni-go'); go.disabled=true; set('Adding\u2026','ok');
    try{ await post('interest', { name, email, film, website:hp }); set('Stay tuned.','ok');
      form.querySelector('.ni-name').value=''; form.querySelector('.ni-email').value=''; }
    catch(err){ set(err.message,'err'); }
    finally{ go.disabled=false; }
  }
  function wireUpcoming(){
    const root = $('#upcoming');
    root.addEventListener('click', e => { const t=e.target.closest('.notify'); if(!t) return;
      const f=document.getElementById('nf-'+t.dataset.i); const open=f.hidden; f.hidden=!open;
      t.setAttribute('aria-expanded', String(open)); if(open) f.querySelector('.ni-name').focus(); });
    root.addEventListener('submit', e => { if(!e.target.classList.contains('nform')) return;
      e.preventDefault(); sendInterest(e.target, e.target.querySelector('.ni-go').dataset.film); });
  }

  async function sendWish(form){
    const film = $('#w-film').value.trim(), director = $('#w-dir').value.trim();
    const by = $('#w-by').value.trim(), note = $('#w-note').value.trim(), hp = $('#w-hp').value;
    const set = (t,cls)=>{ const m=$('#wish-msg'); m.textContent=t; m.className='nmsg '+(cls||''); };
    if (hp) return;
    if (!film || !director) return set('Film and director are required.','err');
    if (!EP) return set('Not connected yet.','err');
    const go=$('#wish-go'); go.disabled=true; set('Sending\u2026','ok');
    try{ await post('wish', { film, director, by, note });
      set('Noted. If it fits, it may appear in Upcoming.','ok');
      $('#w-film').value=''; $('#w-dir').value=''; $('#w-by').value=''; $('#w-note').value=''; }
    catch(err){ set(err.message,'err'); }
    finally{ go.disabled=false; }
  }

  // ---------- past (numbered; optional hold-to-reveal eye) ----------
  function renderPast(){
    const items = (C.past||[]);
    $('#past').innerHTML = `
      <div class="sec-label">Past</div>
      <div class="arch">
        ${items.map(f=>{
          const att = (f.attendees||[]).filter(Boolean);
          const present = att.length
            ? `<div class="att">
                 <span class="att-label">Present</span>
                 <button class="peek" aria-label="Hold to reveal who attended" title="Hold to reveal">
                   <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                 </button>
                 <span class="att-count">${att.length} present</span>
                 <span class="att-names">${att.map(esc).join(' \u00b7 ')}</span>
               </div>`
            : (typeof f.attendance==='number' ? `<div class="att">${f.attendance} present</div>` : '');
          return `
          <article class="entry" tabindex="0">
            <div class="hd"><span class="dt">${esc(fmt(f.date,{day:'2-digit',month:'short',year:'2-digit'}))}</span></div>
            <div class="t">${esc(f.title)} <span>${f.year||''}</span></div>
            <div class="dir">${esc(f.director||'')}</div>
            ${f.synopsis ? `<div class="syn">${esc(f.synopsis)}</div>` : ''}
            ${present}
          </article>`;
        }).join('')}
      </div>
      <div class="wish">
        <button class="notify" id="wish-toggle" aria-expanded="false">Wish for a film</button>
        <form class="wform" id="wish-form" hidden>
          <div class="wrow">
            <input id="w-film" type="text" placeholder="film" autocomplete="off" aria-label="Film" required>
            <input id="w-dir" type="text" placeholder="director" autocomplete="off" aria-label="Director" required>
          </div>
          <input id="w-by" type="text" placeholder="your name (optional)" autocomplete="off" aria-label="Your name">
          <input id="w-note" type="text" placeholder="a line on why (optional)" autocomplete="off" aria-label="Why">
          <div class="whp" aria-hidden="true"><input id="w-hp" type="text" tabindex="-1" autocomplete="off"></div>
          <div class="actions"><button class="ghost" type="submit" id="wish-go">Send wish</button></div>
          <div class="nmsg" id="wish-msg" aria-live="polite"></div>
        </form>
      </div>`;
  }

  // hold the eye to reveal attendees, release to redact (only where attendees are listed)
  function wirePeek(){
    const past = $('#past');
    const hide = () => past.querySelectorAll('.att.revealed').forEach(a=>a.classList.remove('revealed'));
    past.addEventListener('pointerdown', e => { const b=e.target.closest('.peek'); if(!b) return; e.preventDefault(); b.closest('.att').classList.add('revealed'); });
    document.addEventListener('pointerup', hide);
    document.addEventListener('pointercancel', hide);
    past.addEventListener('keydown', e => { const b=e.target.closest('.peek'); if(!b) return; if(e.key===' '||e.key==='Enter'){ e.preventDefault(); b.closest('.att').classList.add('revealed'); } });
    past.addEventListener('keyup', e => { const b=e.target.closest('.peek'); if(!b) return; if(e.key===' '||e.key==='Enter'){ b.closest('.att').classList.remove('revealed'); } });
    past.addEventListener('focusout', e => { const b=e.target.closest&&e.target.closest('.peek'); if(b) b.closest('.att').classList.remove('revealed'); });
    past.addEventListener('click', e => {
      if (e.target.id !== 'wish-toggle') return;
      const f=$('#wish-form'); const open=f.hidden; f.hidden=!open;
      e.target.setAttribute('aria-expanded', String(open)); if(open) $('#w-film').focus();
    });
    past.addEventListener('submit', e => { if (e.target.id !== 'wish-form') return; e.preventDefault(); sendWish(e.target); });
  }

  // ---------- live aggregate + restore own reservation ----------
  async function loadState(){
    if (!EP) return;
    try{ const r = await fetch(EP); const d = await r.json();
      if (d && typeof d.confirmed==='number'){ agg={confirmed:d.confirmed, capacity:d.capacity}; renderCurrent(); } }catch(_){}
  }
  async function restoreMine(){
    if (!EP || !mine) return;
    try{
      const d = await post('mine', { reservationId:mine.reservationId, editToken:mine.editToken });
      slip = { names:d.names, party:d.party, date:d.date };
      if (typeof d.confirmed==='number') agg={confirmed:d.confirmed, capacity:d.capacity};
      roster = d.coming || null;
      reveal({ venue:d.venue, houseNote:d.houseNote });
      renderAdmission();
    }catch(_){ mine=null; store.clear(); renderAdmission(); }   // reservation gone -> reset quietly
  }

  // ---------- init ----------
  renderChrome(); renderVenue(); renderCurrent(); renderAdmission(); renderUpcoming(); renderPast();
  wireAdmission(); wireUpcoming(); wirePeek();
  loadState(); restoreMine();
})();
</script>
</body>
</html>
